# fly.toml app configuration file generated for print-bazar-2-o on 2026-11-04T19:23:47Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'print-bazar-2-o'
primary_region = 'ams'

[build]
[deploy]
  release_command = 'npx prisma migrate deploy'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
